<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Inventario Perú
  </title>


  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>


  <style>

    body {
      background: #f8fafc;
    }


    .spinner {

      width: 24px;
      height: 24px;

      border: 3px solid #e2e8f0;

      border-top-color: #2563eb;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

  </style>

</head>


<body
  class="min-h-screen text-slate-800"
>


<!-- ======================================
     HEADER
====================================== -->

<header
  class="bg-slate-950 text-white"
>

  <div
    class="max-w-7xl mx-auto px-4 py-5"
  >

    <div
      class="flex flex-col md:flex-row
             md:items-center
             md:justify-between
             gap-4"
    >

      <div>

        <h1
          class="text-2xl font-bold"
        >
          Inventario Perú
        </h1>

        <p
          class="text-slate-400 text-sm"
        >
          Gestión de almacenes
        </p>

      </div>


      <div
        class="flex flex-wrap gap-2"
      >

        <button
          id="refreshButton"
          class="px-4 py-2
                 border border-slate-700
                 rounded-lg"
        >
          Actualizar
        </button>


        <button
          id="openMovementModal"
          class="px-4 py-2
                 bg-blue-600
                 rounded-lg
                 font-semibold"
        >
          + Movimiento
        </button>


        <button
          id="openCyclicInventory"
          class="px-4 py-2
                 bg-emerald-600
                 rounded-lg
                 font-semibold"
        >
          Inventario Cíclico
        </button>

      </div>

    </div>

  </div>

</header>



<!-- ======================================
     CONTENIDO
====================================== -->

<main
  class="max-w-7xl mx-auto px-4 py-8"
>


  <!-- MENSAJE -->

  <div
    id="messageContainer"
    class="hidden mb-5"
  ></div>



  <!-- TARJETAS -->

  <div
    class="grid grid-cols-1
           sm:grid-cols-2
           lg:grid-cols-4
           gap-4 mb-7"
  >


    <div
      class="bg-white
             rounded-xl p-5
             shadow"
    >

      <p
        class="text-sm text-slate-500"
      >
        Productos
      </p>

      <p
        id="totalProducts"
        class="text-3xl font-bold"
      >
        0
      </p>

    </div>



    <div
      class="bg-white
             rounded-xl p-5
             shadow"
    >

      <p
        class="text-sm text-slate-500"
      >
        Unidades
      </p>

      <p
        id="totalStock"
        class="text-3xl font-bold"
      >
        0
      </p>

    </div>



    <div
      class="bg-white
             rounded-xl p-5
             shadow"
    >

      <p
        class="text-sm text-slate-500"
      >
        Stock bajo
      </p>

      <p
        id="lowStockCount"
        class="text-3xl
               font-bold
               text-red-600"
      >
        0
      </p>

    </div>



    <div
      class="bg-white
             rounded-xl p-5
             shadow"
    >

      <p
        class="text-sm text-slate-500"
      >
        Ubicaciones
      </p>

      <p
        id="locationsCount"
        class="text-3xl font-bold"
      >
        0
      </p>

    </div>


  </div>



  <!-- FILTROS -->

  <div
    class="bg-white
           rounded-xl
           shadow p-5
           mb-6"
  >

    <div
      class="grid
             grid-cols-1
             md:grid-cols-3
             gap-4"
    >


      <input
        id="searchInput"
        type="search"
        placeholder="Buscar nombre o código..."
        class="border
               rounded-xl
               px-4 py-3"
      >


      <select
        id="locationFilter"
        class="border
               rounded-xl
               px-4 py-3"
      >

        <option value="">
          Todas las ubicaciones
        </option>

      </select>


      <select
        id="stockFilter"
        class="border
               rounded-xl
               px-4 py-3"
      >

        <option value="">
          Todos los estados
        </option>

        <option value="low">
          Stock bajo
        </option>

        <option value="normal">
          Stock normal
        </option>

      </select>


    </div>

  </div>



  <!-- TABLA -->

  <div
    class="bg-white
           rounded-xl
           shadow
           overflow-hidden"
  >

    <div
      class="px-5 py-4

             flex justify-between
             items-center"
    >

      <div>

        <h2
          class="font-bold text-lg"
        >
          Inventario
        </h2>

        <p
          id="resultsLabel"
          class="text-sm text-slate-500"
        >
          Cargando...
        </p>

      </div>


      <div
        id="loadingIndicator"
        class="spinner"

    </div>


    <div
      class="overflow-x-auto"
    >

      <table

      >

        <thead
          class="bg-slate-100"
        >

          <tr>

            <th
              class="px-4 py-3 text-left"
            >
              Código
            </th>

            <th
              class="px-4 py-3 text-left"
            >
              Producto
            </th>

            <th
              class="px-4 py-3 text-left"
            >
              Categoría
            </th>

            <th
              class="px-4 py-3 text-left"
            >
              Ubicación
            </th>

            <th
              class="px-4 py-3 text-right"
            >
              Stock
            </th>

            <th
              class="px-4 py-3"
            >
              Estado
            </th>

          </tr>

        </thead>


        <tbody
          id="inventoryTableBody"
          class="divide-y"
        ></tbody>

      </table>

    </div>


    <div
      id="emptyState"
      class="hidden
             p-10
             text-center
             text-slate-500"
    >
      No se encontraron productos.
    </div>

  </div>


</main>



<!-- ======================================
     MODAL MOVIMIENTO
====================================== -->

<div
  id="movementModal"
  class="hidden

         bg-black/60
         z-50
         overflow-y-auto"
>

  <div
    class="min-h-full
           flex items-center
           justify-center
           p-4"
  >

    <div
      class="bg-white
             rounded-2xl
             max-w-lg
             w-full
             p-6"
    >


      <div
        class="flex
               justify-between
               mb-5"
      >

        <h2
          class="text-xl font-bold"
        >
          Registrar movimiento
        </h2>


        <button
          id="closeMovementModal"
          class="text-2xl"
        >
          ×
        </button>

      </div>



      <form
        id="movementForm"
        class="space-y-4"
      >


        <div>

          <label
            class="block mb-2"
          >
            Producto
          </label>


          <select
            id="productSelect"
            required
            class="w-full
                   border
                   rounded-xl
                   px-4 py-3"
          >

            <option value="">
              Seleccione
            </option>

          </select>

        </div>



        <div>

          <label
            class="block mb-2"
          >
            Tipo
          </label>


          <select
            id="movementType"
            class="w-full
                   border
                   rounded-xl
                   px-4 py-3"
          >

            <option value="entrada">
              Entrada
            </option>

            <option value="salida">
              Salida
            </option>

          </select>

        </div>



        <div>

          <label
            class="block mb-2"
          >
            Cantidad
          </label>


          <input
            id="movementQuantity"
            type="number"
            min="1"
            required
            class="w-full
                   border
                   rounded-xl
                   px-4 py-3"
          >

        </div>



        <div>

          <label
            class="block mb-2"
          >
            Observación
          </label>


          <textarea
            id="movementObservation"
            class="w-full
                   border
                   rounded-xl
                   px-4 py-3"
          ></textarea>

        </div>



        <div>

          <label
            class="block mb-2"
          >
            Clave
            <span
              class="text-slate-400"
            >
              opcional
            </span>
          </label>


          <input
            id="writeToken"
            type="password"
            class="w-full
                   border
                   rounded-xl
                   px-4 py-3"
          >

        </div>



        <button
          id="submitMovement"
          type="submit"
          class="w-full
                 bg-blue-600
                 text-white
                 rounded-xl
                 py-3
                 font-bold"
        >
          Registrar
        </button>


      </form>


    </div>

  </div>

</div>

      <div

<script>

/*************************************************
 * CONFIGURACIÓN IMPORTANTE
 *************************************************/

/*
 * CAMBIA ESTA URL
 *
 * Debes colocar aquí tu URL de Apps Script
 * terminada en /exec
 */
const API_URL =
  'https://script.google.com/macros/s/AKfycbzTFceftrXTUHnCYrsef9t39HuxrUIPQhIi9KbAnCNFhUxVB-JLYxRbNM3BM1FDio7s/exec';



/*************************************************
 * INVENTARIO
 *************************************************/

let inventory = [];


/*************************************************
 * ELEMENTOS INVENTARIO
 *************************************************/

const elements = {

  tableBody:
    document.getElementById(
      'inventoryTableBody'
    ),

  search:
    document.getElementById(
      'searchInput'
    ),

  location:
    document.getElementById(
      'locationFilter'
    ),

  stock:
    document.getElementById(
      'stockFilter'
    ),

  loading:
    document.getElementById(
      'loadingIndicator'
    ),

  empty:
    document.getElementById(
      'emptyState'
    ),

  results:
    document.getElementById(
      'resultsLabel'
    ),

  totalProducts:
    document.getElementById(
      'totalProducts'
    ),

  totalStock:
    document.getElementById(
      'totalStock'
    ),

  lowStock:
    document.getElementById(
      'lowStockCount'
    ),

  locations:
    document.getElementById(
      'locationsCount'
    ),

  modal:
    document.getElementById(
      'movementModal'
    ),

  productSelect:
    document.getElementById(
      'productSelect'
    ),

  form:
    document.getElementById(
      'movementForm'
    ),

  submitButton:
    document.getElementById(
      'submitMovement'
    ),

  message:
    document.getElementById(
      'messageContainer'
    )

};



/*************************************************
 * INICIAR
 *************************************************/

document.addEventListener(
  'DOMContentLoaded',
  init
);


function init() {

  bindEvents();

  loadInventory();

}



/*************************************************
 * EVENTOS
 *************************************************/

function bindEvents() {


  elements.search
    .addEventListener(
      'input',
      renderInventory
    );


  elements.location
    .addEventListener(
      'change',
      renderInventory
    );


  elements.stock
    .addEventListener(
      'change',
      renderInventory
    );


  document
    .getElementById(
      'refreshButton'
    )
    .addEventListener(
      'click',
      loadInventory
    );


  document
    .getElementById(
      'openMovementModal'
    )
    .addEventListener(
      'click',
      openMovementModal
    );


  document
    .getElementById(
      'closeMovementModal'
    )
    .addEventListener(
      'click',
      closeMovementModal
    );


  elements.form
    .addEventListener(
      'submit',
      registerMovement
    );

}



/*************************************************
 * CARGAR INVENTARIO
 *************************************************/

async function loadInventory() {

  setLoading(
    true
  );


  try {

    validateApiUrl();


    const response =
      await fetch(

        API_URL +
        '?action=list&_=' +
        Date.now()

      );


    const result =
      await response.json();


    if (
      !result.ok
    ) {

      throw new Error(
        result.error
      );

    }


    inventory =
      result.data || [];


    updateDashboard();

    fillLocationFilter();

    fillProductSelect();

    renderInventory();


  } catch (error) {

    console.error(
      error
    );


    showMessage(
      'Error: ' +
      error.message,
      'error'
    );

  } finally {

    setLoading(
      false
    );

  }

}



/*************************************************
 * FILTROS
 *************************************************/

function getFilteredInventory() {

  const query =
    elements.search.value
      .trim()
      .toLowerCase();


  const location =
    elements.location.value;


  const stockFilter =
    elements.stock.value;


  return inventory.filter(
    function(product) {


      const matchesSearch =

        !query ||

        String(
          product.producto || ''
        )
          .toLowerCase()
          .includes(query)

        ||

        String(
          product.codigo || ''
        )
          .toLowerCase()
          .includes(query);


      const matchesLocation =

        !location ||

        product.ubicacion ===
        location;


      const isLow =

        Number(
          product.stock
        )

        <=

        Number(
          product.stockMinimo
        );


      let matchesStock =
        true;


      if (
        stockFilter === 'low'
      ) {

        matchesStock =
          isLow;

      }


      if (
        stockFilter === 'normal'
      ) {

        matchesStock =
          !isLow;

      }


      return (

        matchesSearch &&

        matchesLocation &&

        matchesStock

      );

    }
  );

}



/*************************************************
 * TABLA
 *************************************************/

function renderInventory() {

  const products =
    getFilteredInventory();


  elements.tableBody
    .innerHTML = '';


  elements.results.textContent =
    products.length +
    ' productos';


  elements.empty
    .classList
    .toggle(
      'hidden',
      products.length !== 0
    );


  products.forEach(
    function(product) {


      const stock =
        Number(
          product.stock || 0
        );


      const minimum =
        Number(
          product.stockMinimo || 0
        );


      const low =
        stock <= minimum;


      const row =
        document.createElement(
          'tr'
        );


      row.className =
        low
          ? 'bg-red-50'
          : '';


      row.innerHTML = `

        <td class="px-4 py-3 font-mono">
          ${escapeHtml(product.codigo)}
        </td>

        <td class="px-4 py-3 font-medium">
          ${escapeHtml(product.producto)}
        </td>

        <td class="px-4 py-3">
          ${escapeHtml(product.categoria)}
        </td>

        <td class="px-4 py-3">
          ${escapeHtml(product.ubicacion)}
        </td>

        <td class="px-4 py-3 text-right font-bold">
          ${stock}
        </td>

        <td class="px-4 py-3 text-center">

          ${
            low

            ? `
              <span
                class="
                  px-2 py-1
                  rounded-full
                  bg-red-100
                  text-red-700
                  text-xs
                  font-bold
                "
              >
                STOCK BAJO
              </span>
            `

            : `
              <span
                class="
                  px-2 py-1
                  rounded-full
                  bg-emerald-100
                  text-emerald-700
                  text-xs
                  font-bold
                "
              >
                DISPONIBLE
              </span>
            `
          }

        </td>

      `;


      elements.tableBody
        .appendChild(
          row
        );

    }
  );

}



/*************************************************
 * DASHBOARD
 *************************************************/

function updateDashboard() {


  elements.totalProducts
    .textContent =
      inventory.length;


  const totalStock =
    inventory.reduce(
      function(sum, item) {

        return (
          sum +
          Number(
            item.stock || 0
          )
        );

      },
      0
    );


  elements.totalStock
    .textContent =
      totalStock;


  const lowStock =
    inventory.filter(
      function(item) {

        return (

          Number(
            item.stock
          )

          <=

          Number(
            item.stockMinimo
          )

        );

      }
    ).length;


  elements.lowStock
    .textContent =
      lowStock;


  const locations =
    new Set(
      inventory
        .map(
          function(item) {

            return item.ubicacion;

          }
        )
        .filter(Boolean)
    );


  elements.locations
    .textContent =
      locations.size;

}



/*************************************************
 * UBICACIONES
 *************************************************/

function fillLocationFilter() {

  const locations =
    [
      ...new Set(
        inventory
          .map(
            function(item) {

              return item.ubicacion;

            }
          )
          .filter(Boolean)
      )
    ];


  elements.location.innerHTML =
    '<option value="">Todas las ubicaciones</option>';


  locations.forEach(
    function(location) {


      const option =
        document.createElement(
          'option'
        );


      option.value =
        location;


      option.textContent =
        location;


      elements.location
        .appendChild(
          option
        );

    }
  );

}



/*************************************************
 * PRODUCTOS SELECT
 *************************************************/

function fillProductSelect() {


  elements.productSelect.innerHTML =
    '<option value="">Seleccione</option>';


  inventory.forEach(
    function(product) {


      const option =
        document.createElement(
          'option'
        );


      option.value =
        product.codigo;


      option.textContent =

        product.codigo +

        ' - ' +

        product.producto +

        ' | Stock: ' +

        product.stock;


      elements.productSelect
        .appendChild(
          option
        );

    }
  );

}



/*************************************************
 * MOVIMIENTOS
 *************************************************/

function openMovementModal() {

  elements.modal
    .classList
    .remove(
      'hidden'
    );

}


function closeMovementModal() {

  elements.modal
    .classList
    .add(
      'hidden'
    );

}


async function registerMovement(
  event
) {

  event.preventDefault();


  const codigo =
    elements.productSelect.value;


  const tipo =
    document
      .getElementById(
        'movementType'
      )
      .value;


  const cantidad =
    Number(
      document
        .getElementById(
          'movementQuantity'
        )
        .value
    );


  const observacion =
    document
      .getElementById(
        'movementObservation'
      )
      .value;


  const token =
    document
      .getElementById(
        'writeToken'
      )
      .value;


  if (
    !codigo ||
    cantidad <= 0
  ) {

    showMessage(
      'Complete los campos',
      'error'
    );

    return;

  }


  elements.submitButton
    .disabled =
      true;


  elements.submitButton
    .textContent =
      'Guardando...';


  try {


    const response =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'movement',

              codigo:
                codigo,

              tipo:
                tipo,

              cantidad:
                cantidad,

              observacion:
                observacion,

              token:
                token

            })

        }
      );


    const result =
      await response.json();


    if (
      !result.ok
    ) {

      throw new Error(
        result.error
      );

    }


    closeMovementModal();


    showMessage(
      'Movimiento registrado',
      'success'
    );


    elements.form
      .reset();


    await loadInventory();


  } catch (error) {


    showMessage(
      error.message,
      'error'
    );


  } finally {


    elements.submitButton
      .disabled =
        false;


    elements.submitButton
      .textContent =
        'Registrar';

  }

}



/*************************************************
 * INVENTARIO CÍCLICO
 *************************************************/

let cyclicAssignments =
  [];


let cyclicCurrentIndex =
  0;


let cyclicCurrentUser =
  '';



const cyclic = {

  modal:
    document.getElementById(
      'cyclicModal'
    ),

  login:
    document.getElementById(
      'cyclicLogin'
    ),

  task:
    document.getElementById(
      'cyclicTask'
    ),

  user:
    document.getElementById(
      'cyclicUser'
    ),

  progress:
    document.getElementById(
      'cyclicProgress'
    ),

  product:
    document.getElementById(
      'cyclicProduct'
    ),

  expectedLocation:
    document.getElementById(
      'expectedLocation'
    ),

  location:
    document.getElementById(
      'confirmedLocation'
    ),

  locationStatus:
    document.getElementById(
      'locationStatus'
    ),

  code:
    document.getElementById(
      'confirmedCode'
    ),

  codeStatus:
    document.getElementById(
      'codeStatus'
    ),

  stock:
    document.getElementById(
      'cyclicStock'
    ),

  quantity:
    document.getElementById(
      'cyclicQuantity'
    ),

  status:
    document.getElementById(
      'cyclicStatus'
    ),

  next:
    document.getElementById(
      'cyclicNext'
    )

};



/*************************************************
 * EVENTOS CÍCLICO
 *************************************************/

document
  .getElementById(
    'openCyclicInventory'
  )
  .addEventListener(
    'click',
    function() {

      cyclic.modal
        .classList
        .remove(
          'hidden'
        );

    }
  );


document
  .getElementById(
    'closeCyclicModal'
  )
  .addEventListener(
    'click',
    closeCyclicModal
  );


document
  .getElementById(
    'loadAssignments'
  )
  .addEventListener(
    'click',
    loadCyclicAssignments
  );


cyclic.location
  .addEventListener(
    'input',
    validateCyclicTask
  );


cyclic.code
  .addEventListener(
    'input',
    validateCyclicTask
  );


cyclic.quantity
  .addEventListener(
    'input',
    validateCyclicTask
  );


cyclic.next
  .addEventListener(
    'click',
    saveCyclicTask
  );



/*************************************************
 * CARGAR ASIGNACIONES
 *************************************************/

async function loadCyclicAssignments() {


  const user =
    cyclic.user.value
      .trim();


  if (!user) {

    alert(
      'Ingrese un usuario'
    );

    return;

  }


  try {


    const response =
      await fetch(

        API_URL +

        '?action=cyclicAssignments' +

        '&usuario=' +

        encodeURIComponent(
          user
        )

      );


    const result =
      await response.json();


    if (
      !result.ok
    ) {

      throw new Error(
        result.error
      );

    }


    cyclicAssignments =
      result.data || [];


    /*
     * Máximo 3 tareas
     */
    cyclicAssignments =
      cyclicAssignments.slice(
        0,
        3
      );


    if (
      cyclicAssignments.length ===
      0
    ) {

      alert(
        'No hay tareas pendientes para este usuario'
      );

      return;

    }


    cyclicCurrentUser =
      user;


    cyclicCurrentIndex =
      0;


    cyclic.login
      .classList
      .add(
        'hidden'
      );


    cyclic.task
      .classList
      .remove(
        'hidden'
      );


    showCyclicTask();


  } catch (error) {


    alert(
      error.message
    );

  }

}



/*************************************************
 * MOSTRAR TAREA
 *************************************************/

function showCyclicTask() {


  const assignment =
    cyclicAssignments[
      cyclicCurrentIndex
    ];


  cyclic.progress.textContent =

    'Asignación ' +

    (
      cyclicCurrentIndex +
      1
    )

    +

    ' de ' +

    cyclicAssignments.length;


  cyclic.product
    .textContent =
      assignment.producto;


  cyclic.expectedLocation
    .textContent =

      'Ubicación asignada: ' +

      assignment.ubicacion;


  cyclic.stock
    .textContent =
      assignment.stock;


  cyclic.location.value =
    '';


  cyclic.code.value =
    '';


  cyclic.quantity.value =
    '';


  cyclic.locationStatus
    .textContent =
      '';


  cyclic.codeStatus
    .textContent =
      '';


  cyclic.status.textContent =
    '—';


  cyclic.status.className =

    'rounded-xl ' +
    'px-3 py-3 ' +
    'text-center ' +
    'font-bold ' +
    'bg-slate-100';


  cyclic.next.disabled =
    true;


  cyclic.next.textContent =
    'Siguiente';


  setTimeout(
    function() {

      cyclic.location
        .focus();

    },
    100
  );

}



/*************************************************
 * VALIDAR TAREA
 *************************************************/

function validateCyclicTask() {


  const assignment =
    cyclicAssignments[
      cyclicCurrentIndex
    ];


  if (!assignment) {
    return;
  }



  /*
   * UBICACIÓN
   */
  const locationMatches =

    normalizeCyclic(
      cyclic.location.value
    )

    ===

    normalizeCyclic(
      assignment.ubicacion
    );


  if (
    cyclic.location.value.trim()
  ) {


    cyclic.locationStatus
      .textContent =

        locationMatches

          ? '✓ Ubicación confirmada'

          : '✕ Ubicación incorrecta';


    cyclic.locationStatus
      .className =

        locationMatches

          ? 'text-sm mt-2 text-emerald-600 font-semibold'

          : 'text-sm mt-2 text-red-600 font-semibold';

  } else {

    cyclic.locationStatus
      .textContent =
        '';

  }



  /*
   * CÓDIGO
   */
  const codeMatches =

    normalizeCyclic(
      cyclic.code.value
    )

    ===

    normalizeCyclic(
      assignment.codigo
    );


  if (
    cyclic.code.value.trim()
  ) {


    cyclic.codeStatus
      .textContent =

        codeMatches

          ? '✓ Producto confirmado'

          : '✕ Código incorrecto';


    cyclic.codeStatus
      .className =

        codeMatches

          ? 'text-sm mt-2 text-emerald-600 font-semibold'

          : 'text-sm mt-2 text-red-600 font-semibold';

  } else {

    cyclic.codeStatus
      .textContent =
        '';

  }



  /*
   * CANTIDAD
   */
  const quantityText =
    cyclic.quantity.value;


  const hasQuantity =

    quantityText !== ''

    &&

    Number(
      quantityText
    ) >= 0;



  if (
    hasQuantity
  ) {


    const counted =
      Number(
        quantityText
      );


    const stock =
      Number(
        assignment.stock
      );


    if (
      counted === stock
    ) {


      cyclic.status
        .textContent =
          'CONFORME';


      cyclic.status
        .className =

          'rounded-xl ' +
          'px-3 py-3 ' +
          'text-center ' +
          'font-bold ' +
          'bg-emerald-100 ' +
          'text-emerald-700';


    } else {


      cyclic.status
        .textContent =
          'NO CONFORME';


      cyclic.status
        .className =

          'rounded-xl ' +
          'px-3 py-3 ' +
          'text-center ' +
          'font-bold ' +
          'bg-red-100 ' +
          'text-red-700';

    }


  } else {


    cyclic.status
      .textContent =
        '—';


    cyclic.status
      .className =

        'rounded-xl ' +
        'px-3 py-3 ' +
        'text-center ' +
        'font-bold ' +
        'bg-slate-100';

  }



  /*
   * REGLA PRINCIPAL:
   *
   * Solo bloquean:
   *
   * ubicación incorrecta
   * código incorrecto
   *
   * NO CONFORME NO BLOQUEA
   */
  cyclic.next.disabled =

    !(

      locationMatches

      &&

      codeMatches

      &&

      hasQuantity

    );

}



/*************************************************
 * GUARDAR CONTEO
 *************************************************/

async function saveCyclicTask() {


  const assignment =
    cyclicAssignments[
      cyclicCurrentIndex
    ];


  if (!assignment) {
    return;
  }


  cyclic.next.disabled =
    true;


  cyclic.next.textContent =
    'Guardando...';


  try {


    const token =
      document
        .getElementById(
          'writeToken'
        )
        .value;


    const response =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'cyclicCount',

              idAsignacion:
                assignment.id,

              usuario:
                cyclicCurrentUser,

              ubicacion:
                cyclic.location.value,

              codigo:
                cyclic.code.value,

              cantidad:
                Number(
                  cyclic.quantity.value
                ),

              token:
                token

            })

        }
      );


    const result =
      await response.json();


    if (
      !result.ok
    ) {

      throw new Error(
        result.error
      );

    }


    cyclicCurrentIndex++;


    if (

      cyclicCurrentIndex >=

      cyclicAssignments.length

    ) {


      showCyclicCompleted();


    } else {


      showCyclicTask();

    }


  } catch (error) {


    alert(
      error.message
    );


    cyclic.next.disabled =
      false;


  } finally {


    cyclic.next.textContent =
      'Siguiente';

  }

}



/*************************************************
 * FINALIZAR CÍCLICO
 *************************************************/

function showCyclicCompleted() {


  cyclic.progress
    .textContent =
      'Completado';


  cyclic.task
    .innerHTML = `

      <div
        class="
          text-center
          py-10
        "
      >

        <div
          class="
            text-6xl
            text-emerald-600
            mb-4
          "
        >
          ✓
        </div>


        <h3
          class="
            text-2xl
            font-bold
          "
        >
          Conteo completado
        </h3>


        <p
          class="
            text-slate-500
            mt-2
          "
        >

          Se completaron

          ${cyclicAssignments.length}

          ubicaciones.

        </p>


        <button
          onclick="location.reload()"
          class="
            mt-6
            px-6
            py-3
            rounded-xl
            bg-emerald-600
            text-white
            font-bold
          "
        >
          Finalizar
        </button>

      </div>

    `;

}



/*************************************************
 * CERRAR CÍCLICO
 *************************************************/

function closeCyclicModal() {

  cyclic.modal
    .classList
    .add(
      'hidden'
    );

}



/*************************************************
 * UTILIDADES
 *************************************************/

function normalizeCyclic(
  value
) {

  return String(
    value || ''
  )
    .trim()
    .toUpperCase();

}


function escapeHtml(
  value
) {

  const div =
    document.createElement(
      'div'
    );


  div.textContent =
    String(
      value ?? ''
    );


  return div.innerHTML;

}


function setLoading(
  value
) {

  elements.loading
    .classList
    .toggle(
      'hidden',
      !value
    );

}


function validateApiUrl() {

  if (
    API_URL.includes(
      'REEMPLAZA_AQUI_TU_ID'
    )
  ) {

    throw new Error(
      'Debes configurar la URL de Apps Script'
    );

  }

}


function showMessage(
  text,
  type
) {


  elements.message
    .className =

      'mb-5 rounded-xl px-4 py-3 '

      +

      (
        type === 'error'

        ? 'bg-red-100 text-red-700'

        : 'bg-emerald-100 text-emerald-700'
      );


  elements.message
    .textContent =
      text;


  elements.message
    .classList
    .remove(
      'hidden'
    );


  setTimeout(
    function() {

      elements.message
        .classList
        .add(
          'hidden'
        );

    },
    5000
  );

}

</script>
